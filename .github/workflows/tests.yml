name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        # torch and shap are skipped (tests use importorskip); no data, model or network calls needed
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" scikit-learn pydantic
      - name: Frozen method unchanged
        run: python -m threatdet.freeze verify reports/holdout_freeze.json
      - name: Tests
        run: python -m pytest -q
