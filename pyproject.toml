[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threatdet"
version = "0.1.0"
description = "Entity-level behavioral anomaly detection and alert triage on authentication telemetry"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.optional-dependencies]
models = ["scikit-learn>=1.4", "torch>=2.2", "shap>=0.45", "matplotlib>=3.8"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
