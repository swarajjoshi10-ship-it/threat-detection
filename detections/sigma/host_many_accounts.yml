# Stateless approximation of detections/host_fanout_rule.sql as a Sigma correlation rule.
#
# Sigma correlations count events inside a time window and keep no history, so this rule
# counts ALL distinct accounts that log on remotely from one source host in a day. It can't
# separate new accounts from a server's usual crowd, and on LANL it catches 0 of 21 attacker
# host-days at its label-free threshold (reports/detection_count_rule.md). Use it as a
# coarse, portable signal; the stateful version is detections/splunk/host_fanout.spl.
#
# Field mapping from LANL: src_comp -> WorkstationName, src_user -> TargetUserName,
# dst_comp -> Computer, logon_type Network -> LogonType 3.
title: Remote logon by a user account
id: 0b584bce-ee04-4159-9c8d-c8741e3da0d8
name: remote_logon_by_user_account
status: experimental
description: >-
  Successful network logon (Windows 4624, type 3) by a user account; machine accounts and
  anonymous logons are excluded. Base rule for the host fan-out correlation.
author: threat-detection portfolio project
date: 2026-11-25
references:
  - https://csr.lanl.gov/data/cyber1/
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4624
    LogonType: 3
  filter_machine_account:
    TargetUserName|endswith: '$'
  filter_anonymous:
    TargetUserName: 'ANONYMOUS LOGON'
  condition: selection and not 1 of filter_*
falsepositives:
  - Every successful network logon; this base rule is not meant to alert on its own.
level: informational
generate: false
---
title: Many user accounts log on remotely from one source host in a day
id: 94e620b3-bfa4-49d8-a476-2262a1ca7167
status: experimental
description: >-
  One source host authenticates an unusually large number of distinct user accounts to other
  hosts within a day, as in credential reuse or lateral movement from a single foothold. The
  threshold was chosen without labels: at most one alert a day on LANL training days 1-7.
author: threat-detection portfolio project
date: 2026-11-25
references:
  - https://attack.mitre.org/techniques/T1021/
  - https://attack.mitre.org/techniques/T1550/002/
tags:
  - attack.lateral-movement
  - attack.t1021
  - attack.t1078
  - attack.t1550.002
correlation:
  type: value_count
  rules:
    - remote_logon_by_user_account
  group-by:
    - WorkstationName
  timespan: 1d
  condition:
    field: TargetUserName
    gte: 86
falsepositives:
  - Jump hosts, VDI pools, terminal servers and admin or orchestration servers
  - Vulnerability scanners and inventory tools that authenticate as many accounts
level: medium
